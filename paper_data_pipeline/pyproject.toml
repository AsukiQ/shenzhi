[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shenzhi-paper-data"
version = "0.1.0"
description = "Deterministic preparation of Shenzhi paper metadata for retrieval"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shenzhi-prepare-papers = "shenzhi_paper_data.prepare:main"
shenzhi-clean-staging = "shenzhi_paper_data.clean_staging:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
