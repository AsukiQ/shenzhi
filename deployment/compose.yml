name: shenzhi-dev
services:
  neo4j:
    image: neo4j:5.26.27-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 384m
    volumes:
      - neo4j-data:/data
      - ${MIGRATION_BACKUP_DIR:-../migration-data}:/backups:ro
    ports: ["127.0.0.1:17474:7474", "127.0.0.1:17687:7687"]
  # Optional local user database. Normally USER_MYSQL_* points to the existing user database.
  mysql:
    image: mysql:8.0
    profiles: ["local-users"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${USER_MYSQL_ROOT_PASSWORD:?set USER_MYSQL_ROOT_PASSWORD when using local-users}
      MYSQL_DATABASE: ${USER_MYSQL_DATABASE:-paperddl}
      MYSQL_USER: ${USER_MYSQL_USER:-paperddl}
      MYSQL_PASSWORD: ${USER_MYSQL_PASSWORD:?set USER_MYSQL_PASSWORD when using local-users}
    volumes: ["mysql-users-data:/var/lib/mysql"]
  paper-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${PAPER_MYSQL_ROOT_PASSWORD:?set PAPER_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PAPER_MYSQL_DATABASE:-paperddl_papers}
      MYSQL_USER: ${PAPER_MYSQL_USER:-paperddl_papers}
      MYSQL_PASSWORD: ${PAPER_MYSQL_PASSWORD:?set PAPER_MYSQL_PASSWORD}
    volumes:
      - paper-mysql-data:/var/lib/mysql
      - ./paper-mysql-init:/docker-entrypoint-initdb.d:ro

  retrieval:
    build: {context: .., dockerfile: deployment/Dockerfile.retrieval}
    restart: unless-stopped
    depends_on: [neo4j]
    environment:
      RETRIEVAL_MODE: bm25
      RETRIEVAL_HOST: 0.0.0.0
      RETRIEVAL_PORT: 8080
      PAPER_SEARCH_DB: /data/papers_fts.db
      RECALL_K: 300
      MAX_WORKERS: 8
      NEO4J_HTTP_URI: http://neo4j:7474
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_TIMEOUT: 1.5
      ZILLIZ_DENSE_ENABLED: 0
    volumes:
      - ${MIGRATION_DATA_DIR:-../runtime-data}:/data
      - ${MIGRATION_DATA_DIR:-../runtime-data}/images:/images
      - retrieval-imports:/app/retrieval_backend/data/incremental_imports
  node:
    build: {context: .., dockerfile: deployment/Dockerfile.node}
    restart: unless-stopped
    depends_on: [neo4j, paper-mysql]
    environment:
      PORT: 5000
      USER_MYSQL_HOST: ${USER_MYSQL_HOST:?set USER_MYSQL_HOST}
      USER_MYSQL_PORT: ${USER_MYSQL_PORT:-3306}
      USER_MYSQL_DATABASE: ${USER_MYSQL_DATABASE:-paperddl}
      USER_MYSQL_USER: ${USER_MYSQL_USER:?set USER_MYSQL_USER}
      USER_MYSQL_PASSWORD: ${USER_MYSQL_PASSWORD:?set USER_MYSQL_PASSWORD}
      PAPER_MYSQL_HOST: paper-mysql
      PAPER_MYSQL_PORT: 3306
      PAPER_MYSQL_DATABASE: ${PAPER_MYSQL_DATABASE:-paperddl_papers}
      PAPER_MYSQL_USER: ${PAPER_MYSQL_USER:-paperddl_papers}
      PAPER_MYSQL_PASSWORD: ${PAPER_MYSQL_PASSWORD:?set PAPER_MYSQL_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SECURE: false
  web:
    build: {context: .., dockerfile: deployment/Dockerfile.web}
    restart: unless-stopped
    depends_on: [retrieval, node]
    ports: ["${HTTP_PORT:-18088}:80"]
    volumes:
      - ${MIGRATION_DATA_DIR:-../runtime-data}/images:/srv/images:ro
volumes:
  neo4j-data:
  mysql-users-data:
  paper-mysql-data:
  retrieval-imports:
