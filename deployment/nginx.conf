log_format timed '$remote_addr "$request" $status request_time=$request_time upstream_time=$upstream_response_time';
server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log timed;
    client_max_body_size 1m;
    location /api/retrieval/ { proxy_pass http://retrieval:8080/; proxy_read_timeout 30s; }
    location /api/knowledge/ { proxy_pass http://retrieval:8080/knowledge/; proxy_read_timeout 30s; }
    location /api/ { proxy_pass http://node:5000; proxy_read_timeout 30s; }
    location /images/ { alias /srv/images/; expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
}
